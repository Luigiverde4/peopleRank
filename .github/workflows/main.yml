# Ruta en el repo: .github/workflows/supabase-keepalive.yml
# Evita que el proyecto gratuito de Supabase se pause por inactividad (~7 días).
name: Supabase keep-alive

on:
  schedule:
    # Cron en UTC: 03:00 UTC = 04:00 Madrid (invierno) / 05:00 (verano).
    # Días 1, 4, 7, ..., 31 del mes -> nunca más de 3 días entre pings.
    - cron: "0 3 */3 * *"
  workflow_dispatch: # Permite lanzarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # --fail hace que un 4xx/5xx marque el job como fallido (y GitHub te avisa por email)
          # --retry cubre fallos de red puntuales
          response=$(curl --silent --show-error --fail \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "$SUPABASE_URL/rest/v1/rooms?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")

          echo "Response: $response"

          # Una respuesta válida de PostgREST es un array JSON (aunque esté vacío)
          if [[ "$response" != \[* ]]; then
            echo "::error::Unexpected response from Supabase"
            exit 1
          fi
